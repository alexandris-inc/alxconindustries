<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Contact — ALXCON</title>
    <style>
        :root {
            --bg: #050505;
            --text: #f3f3f3;
            --line: #232323;
            --max: 1440px
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            letter-spacing: .02em
        }

        .wrap {
            width: min(calc(100% - 60px), var(--max));
            margin: auto
        }

        .content {
            max-width: 900px;
            padding: 68px 0 100px
        }

        a {
            color: inherit;
            text-decoration: none
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(5, 5, 5, .96);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(10px)
        }

        .nav {
            min-height: 86px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px
        }

        .logo {
            width: 290px;
            max-height: 70px;
            object-fit: contain;
            object-position: left center
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 34px;
            font-size: 12px;
            letter-spacing: .12em
        }

        .menu a {
            opacity: .9
        }

        .menu a:hover {
            opacity: 1
        }

        .quote {
            border: 1px solid #6f6f6f;
            padding: 14px 18px
        }

        .mobile-toggle {
            display: none;
            border: 1px solid #6f6f6f;
            background: transparent;
            color: #fff;
            padding: 9px 11px;
            font-size: 18px;
            line-height: 1;
            cursor: pointer
        }

        h1 {
            font-size: clamp(42px, 6vw, 76px);
            font-weight: 300;
            letter-spacing: .04em;
            margin: 0
        }

        .lead {
            color: #c9c9c9;
            line-height: 1.6;
            margin-top: 18px
        }

        form {
            display: grid;
            gap: 16px;
            margin-top: 36px
        }

        input,
        textarea {
            background: #0b0b0b;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 14px
        }

        button {
            background: #fff;
            color: #000;
            border: 0;
            padding: 14px;
            cursor: pointer
        }

        @media(max-width:1000px) {
            .menu {
                display: none
            }

            .menu.open {
                display: flex;
                position: absolute;
                left: 12px;
                right: 12px;
                top: 72px;
                padding: 18px;
                background: #0a0a0a;
                border: 1px solid var(--line);
                flex-direction: column;
                align-items: stretch;
                gap: 20px
            }

            .mobile-toggle {
                display: block
            }
        }

        @media(max-width:620px) {
            .wrap {
                width: calc(100% - 24px)
            }

            .nav {
                min-height: 72px
            }

            .logo {
                width: 210px
            }

            .content {
                padding: 48px 0 72px
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="wrap nav"><a href="index.html"><img class="logo" src="assets/alxcon-logo.png" alt="ALXCON"></a>
            <nav class="menu"><a href="index.html">HOME</a><a href="projects.html">PROJECTS</a><a
                    href="contact.html">CONTACT</a><a class="quote" href="contact.html">ΖΗΤΗΣΤΕ ΠΡΟΣΦΟΡΑ →</a></nav>
            <button class="mobile-toggle" type="button" aria-label="Άνοιγμα μενού" aria-expanded="false">☰</button>
        </div>
    </header>
    <main class="wrap content">
        <h1>CONTACT</h1>
        <p class="lead">Μιλήστε μας για το επόμενο τεχνικό σας έργο. Θα επικοινωνήσουμε μαζί σας για να δούμε τις
            ανάγκες, το χρονοδιάγραμμα και την κατάλληλη λύση.</p>
        <form>
            <input type="text" placeholder="Ονοματεπώνυμο">
            <input type="email" placeholder="Email">
            <input type="tel" placeholder="Τηλέφωνο">
            <textarea rows="7" placeholder="Περιγράψτε το έργο σας"></textarea>
            <button type="button">ΑΠΟΣΤΟΛΗ</button>
        </form>
    </main>
    <script>const mobileToggle = document.querySelector('.mobile-toggle'); const menu = document.querySelector('.menu'); mobileToggle.addEventListener('click', () => { const open = menu.classList.toggle('open'); mobileToggle.setAttribute('aria-expanded', open); });</script>
</body>

</html>
